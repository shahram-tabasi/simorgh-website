# /etc/nginx/sites-available/simorghai.conf
# One server, two jobs:
#   www.simorghai.com / simorghai.com → the Next.js site on 127.0.0.1:3000 (behind ArvanCloud CDN)
#   mail.simorghai.com                → mailcow web (webmail + mail admin) on 127.0.0.1:8080 / 8443
# See docs/EMAIL-SETUP.fa.md.

map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# ── Website ────────────────────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name simorghai.com www.simorghai.com;

  client_max_body_size 64m;   # admin media uploads

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# ── Mail server web (SOGo webmail, mailcow admin, autodiscover) ──────────────
server {
  listen 80;
  listen [::]:80;
  server_name mail.simorghai.com autodiscover.simorghai.com autoconfig.simorghai.com;

  # mailcow gets its own Let's Encrypt certificate through this.
  location ^~ /.well-known/acme-challenge/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
  }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name mail.simorghai.com autodiscover.simorghai.com autoconfig.simorghai.com;

  # The certificate mailcow keeps up to date.
  ssl_certificate     /opt/mailcow-dockerized/data/assets/ssl/cert.pem;
  ssl_certificate_key /opt/mailcow-dockerized/data/assets/ssl/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 0;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffer_size 128k;
    proxy_buffers 64 512k;
    proxy_busy_buffers_size 512k;
  }
}
