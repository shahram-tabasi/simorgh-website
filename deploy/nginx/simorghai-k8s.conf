# /etc/nginx/conf.d/simorghai-website.conf  on 192.168.1.68
#
# simorghai.com / www.simorghai.com, from the internet:
#
#   browser -> ArvanCloud -> this nginx (TLS: Let's Encrypt wildcard)
#           -> https://192.168.1.220 (the website's Istio gateway on worker3)
#
# LAN PCs never come through here: PowerDNS answers simorghai.com with
# 192.168.1.220 and they talk to the gateway directly.
#
# No other server block may list simorghai.com or www.simorghai.com in its
# server_name (the `*.simorghai.com` wildcard is fine - an exact name wins).
# Check with:
#   nginx -T 2>/dev/null | grep -nE 'server_name[^;]*[[:space:]](www\.)?simorghai\.com[[:space:];]'

upstream simorgh_website {
    server 192.168.1.220:443;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name simorghai.com www.simorghai.com;
    return 301 https://simorghai.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name simorghai.com www.simorghai.com;

    # The wildcard certificate (covers simorghai.com and *.simorghai.com).
    ssl_certificate     /etc/letsencrypt/live/simorghai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simorghai.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # One canonical address; the gateway does the same for LAN clients.
    if ($host = www.simorghai.com) {
        return 301 https://simorghai.com$request_uri;
    }

    # Admin media uploads.
    client_max_body_size 64m;

    # ── The admin panel is LAN-only ──────────────────────────────────────────
    # From the internet every request arrives from an ArvanCloud address, so
    # there is no client address to allow here: the panel is simply closed on
    # this path. From the office, https://simorghai.com/admin reaches it
    # directly through 192.168.1.220. To open it to the internet as well,
    # delete this location block (the panel still needs its password).
    location ~ ^/(admin|api/admin)(/|$) {
        return 404;
    }

    location / {
        proxy_pass https://simorgh_website;

        # The gateway picks its certificate and route by name, so send the
        # real one both in TLS (SNI) and in Host, and verify what comes back
        # against the system CAs - it is the same Let's Encrypt certificate.
        proxy_ssl_server_name on;
        proxy_ssl_name        simorghai.com;
        proxy_ssl_verify      on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_session_reuse on;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
