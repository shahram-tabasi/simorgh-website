# Non-secret settings, read as environment variables. The secret ones
# (ADMIN_PASSWORD, SMTP_PASS, ...) live in the `simorgh-website-secrets`
# Secret, created by hand - see README.md. Changing either needs
#   kubectl -n simorgh-website rollout restart deploy/simorgh-website
apiVersion: v1
kind: ConfigMap
metadata:
  name: simorgh-website-config
  namespace: simorgh-website
  labels:
    app.kubernetes.io/part-of: simorgh-website
data:
  # Also baked into the image at build time (Dockerfile ARG); keep them equal.
  NEXT_PUBLIC_SITE_URL: https://simorghai.com
  # content.json, uploads, backups and form submissions: the PVC in 20-storage.yaml.
  SIMORGH_STORAGE_DIR: /data
  ADMIN_USERNAME: admin
  # /admin sign-in through Keycloak, realm `website` (deploy/keycloak/setup-website-realm.sh):
  # its own users, the role website-admin, lockout and two-step codes. Active once
  # ADMIN_OIDC_CLIENT_SECRET is in the Secret; the shared ADMIN_PASSWORD is then off.
  ADMIN_OIDC_ISSUER: https://auth.simorghai.com/realms/website
  ADMIN_OIDC_INTERNAL_URL: http://keycloak.keycloak.svc.cluster.local:8080/realms/website
  ADMIN_OIDC_CLIENT_ID: simorgh-website
  ADMIN_OIDC_ROLE: website-admin
  # The AI chat and on-the-fly translation run on the office's own LLM
  # (simorgh-technical-chatbot-cloud, docs/LLM-API.md); its key is LLM_API_KEY
  # in the Secret. The 27B answering at once, without visible thinking.
  LLM_BASE_URL: https://llm.simorghai.com/v1
  LLM_MODEL: qwen3.8-27b-nothink
  # Company email: mailcow on .68 (docs/SITE-SETUP.md). The site sends its
  # notifications (contact and demo forms, comments, replies) as noreply@
  # through mailcow's submission port; SMTP_PASS is in the Secret.
  # mail.simorghai.com points at .68 inside the pod (hostAliases, 30-website.yaml).
  MAIL_DOMAIN: simorghai.com
  MAIL_HOST: mail.simorghai.com
  # The office's public address: the admin's DNS page checks the mail records against it.
  MAIL_SERVER_IP: "217.219.39.211"
  # Mailbox management from the admin panel needs mailcow's API, which this
  # pod is not allowed to reach (50-policies.yaml); mailboxes are made in mailcow.
  MAILCOW_URL: ""
  WEBMAIL_URL: https://mail.simorghai.com/SOGo/
  SMTP_HOST: mail.simorghai.com
  SMTP_PORT: "587"
  SMTP_USER: noreply@simorghai.com
  SMTP_FROM: "SIMORGH <noreply@simorghai.com>"
