# kubectl apply -k deploy/k8s
#
# 20-storage.yaml (the data volume) is applied separately, once, so that
# `kubectl delete -k deploy/k8s` never takes the website's content with it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 10-config.yaml
  - 30-website.yaml
  - 40-gateway.yaml
  - 50-policies.yaml
images:
  # Upgrade = build a new tag, change it here, apply again. Always a new tag:
  # the pod pulls IfNotPresent, so re-pushing the same tag changes nothing.
  - name: registry.simorghai.com/simorgh/simorgh-website
    newTag: "1.0.0"
