apiVersion: v1
kind: ServiceAccount
metadata:
  name: simorgh-website
  namespace: simorgh-website
  labels:
    app.kubernetes.io/part-of: simorgh-website
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simorgh-website
  namespace: simorgh-website
  labels:
    app.kubernetes.io/name: simorgh-website
    app.kubernetes.io/part-of: simorgh-website
spec:
  # One: the data volume is ReadWriteOnce (see 20-storage.yaml).
  replicas: 1
  # The old pod must let go of the volume before the new one can mount it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: simorgh-website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simorgh-website
        app.kubernetes.io/part-of: simorgh-website
    spec:
      serviceAccountName: simorgh-website
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      # worker3 serves the website.
      nodeSelector:
        kubernetes.io/hostname: worker3
      # If worker3 is later tainted for a pool, the website stays on it.
      tolerations:
        - key: simorgh.io/pool
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Makes the Ceph volume writable for uid 65532.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: website
          # The tag is set in kustomization.yaml (`images:`), so an upgrade is
          # a one-line change there.
          image: registry.simorghai.com/simorgh/simorgh-website
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef:
                name: simorgh-website-config
            - secretRef:
                name: simorgh-website-secrets
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits:   { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: "/api/health?ready", port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: data,       mountPath: /data }
            # Next's own cache (fetch/ISR); rebuilt on demand, so not on Ceph.
            - { name: next-cache, mountPath: /app/.next/cache }
            - { name: tmp,        mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: simorgh-website-data
        - name: next-cache
          emptyDir: { sizeLimit: 1Gi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: simorgh-website
  namespace: simorgh-website
  labels:
    app.kubernetes.io/name: simorgh-website
    app.kubernetes.io/part-of: simorgh-website
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: simorgh-website
  ports:
    - name: http
      port: 3000
      targetPort: http
      appProtocol: http
