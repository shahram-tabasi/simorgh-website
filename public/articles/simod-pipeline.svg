<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <title>SIMOD discovery pipeline</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1330"/><stop offset="1" stop-color="#05080f"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2ad3f0"/></marker>
  </defs>
  <rect width="1200" height="560" rx="18" fill="url(#bg)"/>
  <text x="40" y="52" fill="#7ce6f7" font-size="15" letter-spacing="3">SIMOD · AUTOMATED DISCOVERY OF A SIMULATION MODEL</text>

  <!-- inputs -->
  <g font-size="15" fill="#e7edff">
    <rect x="40" y="110" width="190" height="78" rx="10" fill="#101a3a" stroke="#2ad3f0" stroke-opacity=".5"/>
    <text x="135" y="143" text-anchor="middle" font-weight="600">Event log (CSV)</text>
    <text x="135" y="166" text-anchor="middle" fill="#9fb0d8" font-size="12.5">case · activity · start · end · resource</text>
    <rect x="40" y="212" width="190" height="62" rx="10" fill="#101a3a" stroke="#5b6b95" stroke-dasharray="5 4"/>
    <text x="135" y="240" text-anchor="middle" font-weight="600">BPMN model</text>
    <text x="135" y="260" text-anchor="middle" fill="#9fb0d8" font-size="12.5">optional</text>
    <rect x="40" y="298" width="190" height="62" rx="10" fill="#101a3a" stroke="#5b6b95"/>
    <text x="135" y="326" text-anchor="middle" font-weight="600">Configuration</text>
    <text x="135" y="346" text-anchor="middle" fill="#9fb0d8" font-size="12.5">YAML: what to search</text>
  </g>
  <path d="M232 235 H282" stroke="#2ad3f0" stroke-width="2" marker-end="url(#a)"/>

  <!-- stages -->
  <g font-size="14" fill="#e7edff">
    <rect x="290" y="100" width="610" height="290" rx="14" fill="none" stroke="#2ad3f0" stroke-opacity=".25"/>
    <text x="306" y="124" fill="#7ce6f7" font-size="12" letter-spacing="2">PIPELINE · EACH TUNED STAGE IS OPTIMISED (TPE / HYPEROPT)</text>
    <g>
      <rect x="306" y="140" width="180" height="96" rx="10" fill="#0f2147"/>
      <text x="320" y="166" font-weight="600">1 · Preprocessing</text>
      <text x="320" y="188" fill="#9fb0d8" font-size="12.5">enabled times,</text>
      <text x="320" y="206" fill="#9fb0d8" font-size="12.5">concurrency, multitasking</text>
    </g>
    <g>
      <rect x="500" y="140" width="190" height="96" rx="10" fill="#0f2147"/>
      <text x="514" y="166" font-weight="600">2 · Control flow</text>
      <text x="514" y="188" fill="#9fb0d8" font-size="12.5">Split Miner, gateway</text>
      <text x="514" y="206" fill="#9fb0d8" font-size="12.5">probabilities, data rules</text>
      <text x="514" y="226" fill="#2ad3f0" font-size="11.5">loss: n-gram distance</text>
    </g>
    <g>
      <rect x="704" y="140" width="182" height="96" rx="10" fill="#0f2147"/>
      <text x="718" y="166" font-weight="600">3 · Case arrivals</text>
      <text x="718" y="188" fill="#9fb0d8" font-size="12.5">inter-arrival</text>
      <text x="718" y="206" fill="#9fb0d8" font-size="12.5">distribution</text>
      <text x="718" y="226" fill="#2ad3f0" font-size="11.5">loss: arrival distribution</text>
    </g>
    <g>
      <rect x="306" y="252" width="284" height="124" rx="10" fill="#0f2147"/>
      <text x="320" y="278" font-weight="600">4 · Resource model</text>
      <text x="320" y="300" fill="#9fb0d8" font-size="12.5">availability calendars per person or pool</text>
      <text x="320" y="318" fill="#9fb0d8" font-size="12.5">(differentiated · pooled · fuzzy),</text>
      <text x="320" y="336" fill="#9fb0d8" font-size="12.5">durations, priorities, batching</text>
      <text x="320" y="360" fill="#2ad3f0" font-size="11.5">loss: circadian EMD</text>
    </g>
    <g>
      <rect x="604" y="252" width="282" height="124" rx="10" fill="#0f2147"/>
      <text x="618" y="278" font-weight="600">5 · Extraneous delays</text>
      <text x="618" y="300" fill="#9fb0d8" font-size="12.5">waiting not caused by resources:</text>
      <text x="618" y="318" fill="#9fb0d8" font-size="12.5">customers, suppliers, signatures,</text>
      <text x="618" y="336" fill="#9fb0d8" font-size="12.5">added to the model as timers</text>
    </g>
  </g>
  <path d="M902 245 H952" stroke="#2ad3f0" stroke-width="2" marker-end="url(#a)"/>

  <!-- output -->
  <g font-size="15" fill="#e7edff">
    <rect x="960" y="140" width="200" height="210" rx="12" fill="#0d2a33" stroke="#2ad3f0"/>
    <text x="1060" y="172" text-anchor="middle" font-weight="600">BPS model</text>
    <text x="1060" y="200" text-anchor="middle" fill="#9fb0d8" font-size="12.5">BPMN diagram</text>
    <text x="1060" y="220" text-anchor="middle" fill="#9fb0d8" font-size="12.5">+ simulation parameters</text>
    <line x1="985" y1="240" x2="1135" y2="240" stroke="#2ad3f0" stroke-opacity=".3"/>
    <text x="1060" y="266" text-anchor="middle" font-weight="600">Prosimos</text>
    <text x="1060" y="288" text-anchor="middle" fill="#9fb0d8" font-size="12.5">simulate the baseline</text>
    <text x="1060" y="308" text-anchor="middle" fill="#9fb0d8" font-size="12.5">and what-if scenarios</text>
  </g>

  <!-- evaluation -->
  <g font-size="13" fill="#9fb0d8">
    <rect x="290" y="420" width="870" height="96" rx="12" fill="#0a1024" stroke="#5b6b95" stroke-opacity=".6"/>
    <text x="310" y="448" fill="#e7edff" font-size="14.5" font-weight="600">6 · Evaluation against a held-out part of the log</text>
    <text x="310" y="474">n-gram distance (order of activities) · absolute and relative event distribution · circadian distribution</text>
    <text x="310" y="496">(time of day) · arrival distribution · cycle-time distribution: the simulated log must look like the real one</text>
  </g>
  <path d="M1060 352 V412" stroke="#5b6b95" stroke-width="2" marker-end="url(#a)"/>
</svg>
